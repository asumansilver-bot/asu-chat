plugins { id 'com.android.application' }

android {
    namespace 'com.asu.chat'
    compileSdk 35
    defaultConfig {
        applicationId 'com.asu.chat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the standard debug key so the APK installs directly.
            // For the Play Store, create your own keystore and signingConfig.
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
